<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TeraBox Stream Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --error-color: #ef4444;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding: 16px; 
            min-height: 100vh;
        }

        .container { 
            max-width: 600px; 
            margin: 0 auto; 
        }

        .search-box {
            background: var(--card-bg);
            padding: 14px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            background: #090d16;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 14px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
        }

        .search-box button {
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 0 18px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .video-wrapper { 
            width: 100%; 
            background: #000; 
            border-radius: 16px; 
            overflow: hidden; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); 
            margin-bottom: 20px; 
            border: 1px solid var(--border-color);
            display: none;
        }

        video { 
            width: 100%; 
            height: auto; 
            display: block; 
            max-height: 70vh; 
        }

        .file-title { 
            font-size: 15px; 
            font-weight: 600; 
            margin-bottom: 20px; 
            line-height: 1.4;
            color: var(--text-main);
            word-break: break-all; 
            background: var(--card-bg);
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: none;
        }

        .grid-info { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
            margin-bottom: 24px; 
            display: none;
        }

        .card { 
            background: var(--card-bg); 
            padding: 14px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color);
        }

        .card-label { 
            font-size: 11px; 
            font-weight: 700; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
            margin-bottom: 6px; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }

        .card-value { 
            font-size: 15px; 
            font-weight: 600; 
            color: var(--text-main); 
        }
        
        .btn-download {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
            transition: all 0.2s ease;
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            border: 1px solid var(--error-color);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="container">
    <div class="search-box">
        <input type="text" id="terabox-url" placeholder="Paste TeraBox Link here..." autocomplete="off">
        <button id="fetch-btn" onclick="sendUrlToBot()">Fetch & Play</button>
    </div>

    <div id="error-box" class="error-msg"></div>

    <div class="video-wrapper" id="video-wrapper">
        <video id="video" controls playsinline></video>
    </div>

    <div class="file-title" id="video-title">Loading...</div>

    <div class="grid-info" id="grid-info">
        <div class="card">
            <div class="card-label">📦 SIZE</div>
            <div class="card-value" id="info-size">--</div>
        </div>
        <div class="card">
            <div class="card-label">⏱️ DURATION</div>
            <div class="card-value" id="info-dur">--</div>
        </div>
        <div class="card">
            <div class="card-label">⚡ RESOLUTION</div>
            <div class="card-value" id="info-res">Auto</div>
        </div>
        <div class="card">
            <div class="card-label">📂 TYPE</div>
            <div class="card-value" id="info-type">Video</div>
        </div>
    </div>

    <button id="download-btn" class="btn-download">
        ⬇️ Direct Download
    </button>
</div>

<script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
        tg.ready();
        tg.expand();
    }

    let currentStreamUrl = "";

    function showError(msg) {
        const errBox = document.getElementById('error-box');
        errBox.innerText = msg;
        errBox.style.display = 'block';
    }

    function sendUrlToBot() {
        const inputField = document.getElementById('terabox-url');
        const url = inputField.value.trim();

        if (!url) {
            showError("Please enter a valid TeraBox URL!");
            return;
        }

        if (tg && tg.sendData) {
            tg.sendData(JSON.stringify({ action: "fetch_terabox", url: url }));
            tg.close();
        } else {
            showError("Mini App context error. Please open inside Telegram!");
        }
    }

    function playVideo(streamUrl, title, size, res, dur) {
        currentStreamUrl = streamUrl;

        document.getElementById('video-wrapper').style.display = 'block';
        document.getElementById('video-title').style.display = 'block';
        document.getElementById('grid-info').style.display = 'grid';
        document.getElementById('download-btn').style.display = 'flex';

        document.getElementById('video-title').innerText = title;
        document.getElementById('info-size').innerText = size;
        document.getElementById('info-res').innerText = res;
        document.getElementById('info-dur').innerText = dur;

        const video = document.getElementById('video');

        if (Hls.isSupported() && (streamUrl.includes('.m3u8') || !streamUrl.includes('.mp4'))) {
            const hls = new Hls();
            hls.loadSource(streamUrl);
            hls.attachMedia(video);
        } else {
            video.src = streamUrl;
        }

        video.play();
    }

    document.getElementById('download-btn').addEventListener('click', function(e) {
        e.preventDefault();
        if (currentStreamUrl) {
            window.open(currentStreamUrl, '_blank');
        }
    });

    const urlParams = new URLSearchParams(window.location.search);
    const directSrc = urlParams.get('src');
    if (directSrc) {
        const title = urlParams.get('title') || 'TeraBox Video';
        const size = urlParams.get('size') || 'Unknown';
        const res = urlParams.get('res') || 'Auto';
        const dur = urlParams.get('dur') || '--';
        playVideo(directSrc, title, size, res, dur);
    }
</script>

</body>
</html>
