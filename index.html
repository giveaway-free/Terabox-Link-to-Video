<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js?v=1.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/artplayer@latest/dist/artplayer.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f8fafc; color: #0f172a; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 16px; }
        
        .player-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        #artplayer { width: 100%; height: 100%; }

        .video-title { font-size: 18px; font-weight: 700; line-height: 1.3; color: #0f172a; word-break: break-word; }
        
        .grid-info { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .info-card {
            background: #f1f5f9;
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .info-card .label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: #64748b; }
        .info-card .value { font-size: 14px; font-weight: 600; color: #1e293b; }

        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn-primary { background: #7c3aed; color: #ffffff; }
        .btn-secondary { background: #ffffff; color: #0f172a; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>

<div class="container">
    <div class="player-wrapper">
        <div id="artplayer"></div>
    </div>

    <h1 class="video-title" id="title">Loading Title...</h1>

    <div class="grid-info">
        <div class="info-card">
            <span class="label">📦 SIZE</span>
            <span class="value" id="size">--</span>
        </div>
        <div class="info-card">
            <span class="label">⏱ DURATION</span>
            <span class="value" id="duration">--</span>
        </div>
        <div class="info-card">
            <span class="label">⚡ RESOLUTION</span>
            <span class="value">1080p Max</span>
        </div>
        <div class="info-card">
            <span class="label">📁 TYPE</span>
            <span class="value">Video</span>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn btn-primary" onclick="playVideo()">
            ▶ Watch Now
        </button>
        <button class="btn btn-secondary" id="downloadBtn" onclick="triggerDownload()">
            ↓ Direct Download
        </button>
    </div>
</div>

<script>
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }

    const urlParams = new URLSearchParams(window.location.search);
    const videoSrc = urlParams.get('src');
    const videoTitle = urlParams.get('title') || "TeraBox_Video.mp4";
    const videoSize = urlParams.get('size') || "Auto";

    document.getElementById('title').innerText = videoTitle;
    document.getElementById('size').innerText = videoSize;

    const art = new Artplayer({
        container: '#artplayer',
        url: videoSrc,
        type: 'm3u8',
        autoplay: false,
        fullscreen: true,
        miniProgressBar: true,
        customType: {
            m3u8: function (video, url) {
                if (Hls.isSupported()) {
                    const hls = new Hls({ enableWorker: true, lowLatencyMode: true });
                    hls.loadSource(url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, function () {
                        const durationSec = video.duration;
                        if(durationSec && !isNaN(durationSec)) {
                            const mins = Math.floor(durationSec / 60);
                            const secs = Math.floor(durationSec % 60);
                            document.getElementById('duration').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                        }
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                }
            },
        },
    });

    function playVideo() {
        art.play();
        document.querySelector('.player-wrapper').scrollIntoView({ behavior: 'smooth' });
    }

    function triggerDownload() {
        if (!videoSrc) return;
        const btn = document.getElementById('downloadBtn');
        btn.innerText = "⏳ Directing to Download...";
        
        window.location.href = videoSrc;

        setTimeout(() => {
            btn.innerText = "↓ Direct Download";
        }, 3000);
    }
</script>

</body>
</html>
