<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TeraBox Stream Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --control-hover: rgba(255, 255, 255, 0.15);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding: 12px; 
            min-height: 100vh;
        }

        .container { 
            max-width: 650px; 
            margin: 0 auto; 
        }

        /* Video Container */
        .video-wrapper { 
            position: relative;
            width: 100%; 
            background: #000; 
            border-radius: 14px; 
            overflow: hidden; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6); 
            margin-bottom: 16px; 
            border: 1px solid var(--border-color);
            display: none;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Guaranteed Fullscreen Fallback */
        .video-wrapper.pseudo-fullscreen {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-height: 100vh !important;
            z-index: 999999 !important;
            border-radius: 0 !important;
            border: none !important;
            margin: 0 !important;
            display: flex !important;
            align-items: center;
            justify-content: center;
            background: #000 !important;
        }

        .video-wrapper.pseudo-fullscreen video {
            max-height: 100vh !important;
            height: 100% !important;
            width: 100% !important;
            object-fit: contain;
        }

        /* In-App Floating Mini Player Window */
        .video-wrapper.floating-window {
            position: fixed !important;
            bottom: 20px !important;
            right: 16px !important;
            width: 220px !important;
            height: 130px !important;
            z-index: 99999 !important;
            border-radius: 12px !important;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.85) !important;
            border: 2px solid var(--accent-color) !important;
            margin: 0 !important;
        }

        .video-wrapper.floating-window video {
            height: 100% !important;
            object-fit: cover !important;
        }

        .floating-bar {
            display: none;
            position: absolute;
            top: 4px;
            right: 4px;
            z-index: 20;
            gap: 4px;
        }

        .video-wrapper.floating-window .floating-bar {
            display: flex;
        }

        .floating-btn {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 6px;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        video { 
            width: 100%; 
            height: auto; 
            display: block; 
            max-height: 70vh; 
            cursor: pointer;
        }

        /* Action Indicator */
        .overlay-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.6);
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
            z-index: 10;
        }
        .overlay-indicator.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Player Controls Bar */
        .player-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, transparent 0%, rgba(11, 17, 32, 0.95) 85%);
            padding: 12px 10px 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            opacity: 0;
            transition: opacity 0.25s ease;
            z-index: 5;
        }

        .video-wrapper:hover .player-controls,
        .video-wrapper.touch-active .player-controls {
            opacity: 1;
        }

        .timeline-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-bar {
            position: relative;
            flex: 1;
            height: 5px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 4px;
            cursor: pointer;
            transition: height 0.15s ease;
        }
        .progress-bar:hover {
            height: 7px;
        }

        .progress-filled {
            height: 100%;
            width: 0%;
            background: var(--accent-color);
            border-radius: 4px;
            position: relative;
        }

        .progress-filled::after {
            content: '';
            position: absolute;
            right: -4px;
            top: 50%;
            transform: translateY(-50%);
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(0,0,0,0.5);
        }

        .time-display {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            min-width: 75px;
            text-align: right;
        }

        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 4px;
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .ctrl-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 13px;
            padding: 5px;
            min-width: 30px;
            height: 30px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            transition: background 0.15s;
        }
        .ctrl-btn:hover {
            background: var(--control-hover);
        }
        .ctrl-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .btn-skip {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 5px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 6px;
        }

        .volume-box {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .volume-slider {
            width: 45px;
            height: 4px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
        }

        .speed-select {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 11px;
            font-weight: 600;
            border-radius: 6px;
            padding: 3px 4px;
            cursor: pointer;
            outline: none;
            height: 28px;
        }

        @media (max-width: 400px) {
            .volume-slider {
                display: none;
            }
            .time-display {
                font-size: 10px;
                min-width: 65px;
            }
        }

        .file-title { 
            font-size: 14px; 
            font-weight: 600; 
            margin-bottom: 16px; 
            line-height: 1.4;
            color: var(--text-main);
            word-break: break-all; 
            background: var(--card-bg);
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: none;
        }

        .grid-info { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
            margin-bottom: 20px; 
            display: none;
        }

        .card { 
            background: var(--card-bg); 
            padding: 12px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color);
        }

        .card-label { 
            font-size: 11px; 
            font-weight: 700; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
            margin-bottom: 4px; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }

        .card-value { 
            font-size: 14px; 
            font-weight: 600; 
            color: var(--text-main); 
        }
        
        .btn-download {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
            transition: all 0.2s ease;
        }

        .no-video {
            text-align: center;
            padding: 40px 20px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            margin-top: 40px;
        }

        .no-video h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .no-video p {
            color: var(--text-muted);
            font-size: 14px;
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="container">
    <div id="no-video-box" class="no-video">
        <h3>🎬 No Video Selected</h3>
        <p>Please send a TeraBox link in Telegram Bot and click "Open Player".</p>
    </div>

    <div class="video-wrapper" id="video-wrapper">
        <video id="video" playsinline webkit-playsinline></video>
        
        <!-- Floating Window Toolbar (Restore / Close) -->
        <div class="floating-bar" id="floating-bar">
            <button class="floating-btn" id="btn-restore-pip" title="Restore Size">↗ Expand</button>
            <button class="floating-btn" id="btn-close-pip" title="Close Float">✕</button>
        </div>

        <div class="overlay-indicator" id="overlay-indicator">▶</div>

        <!-- Controls -->
        <div class="player-controls" id="player-controls">
            <div class="timeline-container">
                <div class="progress-bar" id="progress-bar">
                    <div class="progress-filled" id="progress-filled"></div>
                </div>
                <div class="time-display" id="time-display">00:00 / 00:00</div>
            </div>

            <div class="controls-row">
                <div class="controls-group">
                    <button class="ctrl-btn" id="btn-play" title="Play/Pause">
                        <svg viewBox="0 0 24 24" id="play-icon"><path d="M8 5v14l11-7z"/></svg>
                    </button>

                    <button class="ctrl-btn btn-skip" id="btn-rewind" title="Rewind 10s">
                        -10s
                    </button>

                    <button class="ctrl-btn btn-skip" id="btn-forward" title="Forward 10s">
                        +10s
                    </button>

                    <div class="volume-box">
                        <button class="ctrl-btn" id="btn-mute" title="Mute/Unmute">
                            <svg viewBox="0 0 24 24" id="vol-icon"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                        </button>
                        <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.05" value="1">
                    </div>
                </div>

                <div class="controls-group">
                    <select class="speed-select" id="speed-select" title="Speed">
                        <option value="0.5">0.5x</option>
                        <option value="0.75">0.75x</option>
                        <option value="1" selected>1.0x</option>
                        <option value="1.25">1.25x</option>
                        <option value="1.5">1.5x</option>
                        <option value="2">2.0x</option>
                    </select>

                    <!-- Floating Window Button -->
                    <button class="ctrl-btn" id="btn-pip" title="Floating Window">
                        <svg viewBox="0 0 24 24"><path d="M19 7h-8v6h8V7zm2-4H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16.01H3V4.99h18v14.02z"/></svg>
                    </button>

                    <!-- Fullscreen Button -->
                    <button class="ctrl-btn" id="btn-fullscreen" title="Fullscreen">
                        <svg viewBox="0 0 24 24" id="fs-icon"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="file-title" id="video-title">Loading...</div>

    <div class="grid-info" id="grid-info">
        <div class="card">
            <div class="card-label">📦 SIZE</div>
            <div class="card-value" id="info-size">--</div>
        </div>
        <div class="card">
            <div class="card-label">⏱️ DURATION</div>
            <div class="card-value" id="info-dur">--</div>
        </div>
        <div class="card">
            <div class="card-label">⚡ RESOLUTION</div>
            <div class="card-value" id="info-res">Auto</div>
        </div>
        <div class="card">
            <div class="card-label">📂 TYPE</div>
            <div class="card-value" id="info-type">Video</div>
        </div>
    </div>

    <button id="download-btn" class="btn-download">
        ⬇️ Direct Download
    </button>
</div>

<script>
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }

    let currentStreamUrl = "";
    const video = document.getElementById('video');
    const videoWrapper = document.getElementById('video-wrapper');
    const btnPlay = document.getElementById('btn-play');
    const playIcon = document.getElementById('play-icon');
    const btnRewind = document.getElementById('btn-rewind');
    const btnForward = document.getElementById('btn-forward');
    const btnMute = document.getElementById('btn-mute');
    const volIcon = document.getElementById('vol-icon');
    const volumeSlider = document.getElementById('volume-slider');
    const speedSelect = document.getElementById('speed-select');
    const btnPip = document.getElementById('btn-pip');
    const btnRestorePip = document.getElementById('btn-restore-pip');
    const btnClosePip = document.getElementById('btn-close-pip');
    const btnFullscreen = document.getElementById('btn-fullscreen');
    const fsIcon = document.getElementById('fs-icon');
    const progressBar = document.getElementById('progress-bar');
    const progressFilled = document.getElementById('progress-filled');
    const timeDisplay = document.getElementById('time-display');
    const overlayIndicator = document.getElementById('overlay-indicator');

    let controlsTimeout = null;

    function formatTime(seconds) {
        if (isNaN(seconds) || seconds < 0) return "00:00";
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = Math.floor(seconds % 60);
        if (h > 0) {
            return `${h}:${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }
        return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function showOverlay(text) {
        overlayIndicator.innerText = text;
        overlayIndicator.classList.add('show');
        setTimeout(() => overlayIndicator.classList.remove('show'), 350);
    }

    function updatePlayIcon(isPlaying) {
        if (isPlaying) {
            playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        } else {
            playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        }
    }

    function togglePlay() {
        if (video.paused || video.ended) {
            video.play();
            updatePlayIcon(true);
            showOverlay('▶ Play');
        } else {
            video.pause();
            updatePlayIcon(false);
            showOverlay('⏸ Pause');
        }
    }

    btnPlay.addEventListener('click', togglePlay);
    video.addEventListener('click', () => {
        if (!videoWrapper.classList.contains('floating-window')) {
            togglePlay();
        }
    });

    btnRewind.addEventListener('click', () => {
        video.currentTime = Math.max(0, video.currentTime - 10);
        showOverlay('-10s');
    });

    btnForward.addEventListener('click', () => {
        video.currentTime = Math.min(video.duration || Infinity, video.currentTime + 10);
        showOverlay('+10s');
    });

    volumeSlider.addEventListener('input', (e) => {
        video.volume = parseFloat(e.target.value);
        video.muted = video.volume === 0;
        updateVolumeIcon();
    });

    btnMute.addEventListener('click', () => {
        video.muted = !video.muted;
        if (video.muted) {
            volumeSlider.value = 0;
        } else {
            volumeSlider.value = video.volume > 0 ? video.volume : 1;
            video.volume = volumeSlider.value;
        }
        updateVolumeIcon();
    });

    function updateVolumeIcon() {
        if (video.muted || video.volume === 0) {
            volIcon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27l4.73 4.73H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
        } else {
            volIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
        }
    }

    speedSelect.addEventListener('change', (e) => {
        video.playbackRate = parseFloat(e.target.value);
        showOverlay(`${e.target.value}x`);
    });

    /* --- Hybrid Floating Window / In-App PiP System --- */
    function toggleFloatingWindow() {
        if (videoWrapper.classList.contains('floating-window')) {
            videoWrapper.classList.remove('floating-window');
            showOverlay('Window Restored');
        } else {
            // Exit fullscreen if active
            videoWrapper.classList.remove('pseudo-fullscreen');
            if (document.fullscreenElement && document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            }
            videoWrapper.classList.add('floating-window');
            showOverlay('Floating Mode');
        }
    }

    btnPip.addEventListener('click', async () => {
        // Try OS-level PiP first
        if (document.pictureInPictureEnabled && video.requestPictureInPicture) {
            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                    return;
                } else {
                    await video.requestPictureInPicture();
                    return;
                }
            } catch (err) {
                // Telegram WebApp blocks native PiP -> Instant In-App Floating Fallback
                toggleFloatingWindow();
            }
        } else if (video.webkitSetPresentationMode) {
            try {
                const mode = video.webkitPresentationMode === 'picture-in-picture' ? 'inline' : 'picture-in-picture';
                video.webkitSetPresentationMode(mode);
            } catch(e) {
                toggleFloatingWindow();
            }
        } else {
            // Direct In-App Floating Window Fallback
            toggleFloatingWindow();
        }
    });

    btnRestorePip.addEventListener('click', (e) => {
        e.stopPropagation();
        videoWrapper.classList.remove('floating-window');
    });

    btnClosePip.addEventListener('click', (e) => {
        e.stopPropagation();
        videoWrapper.classList.remove('floating-window');
        video.pause();
        updatePlayIcon(false);
    });

    /* --- Robust Fullscreen Support --- */
    function isFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement || videoWrapper.classList.contains('pseudo-fullscreen'));
    }

    function updateFsIcon(full) {
        if (full) {
            fsIcon.innerHTML = '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>';
        } else {
            fsIcon.innerHTML = '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>';
        }
    }

    btnFullscreen.addEventListener('click', () => {
        // If in floating window, restore first
        if (videoWrapper.classList.contains('floating-window')) {
            videoWrapper.classList.remove('floating-window');
        }

        if (!isFullscreen()) {
            if (videoWrapper.requestFullscreen) {
                videoWrapper.requestFullscreen().catch(() => tryDirectVideoFullscreen());
            } else {
                tryDirectVideoFullscreen();
            }
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
            videoWrapper.classList.remove('pseudo-fullscreen');
            updateFsIcon(false);
        }
    });

    function tryDirectVideoFullscreen() {
        if (video.webkitEnterFullscreen) {
            video.webkitEnterFullscreen();
            updateFsIcon(true);
        } else {
            videoWrapper.classList.add('pseudo-fullscreen');
            updateFsIcon(true);
        }
    }

    document.addEventListener('fullscreenchange', () => {
        updateFsIcon(!!document.fullscreenElement);
    });
    document.addEventListener('webkitfullscreenchange', () => {
        updateFsIcon(!!document.webkitFullscreenElement);
    });

    video.addEventListener('timeupdate', () => {
        if (video.duration) {
            const percent = (video.currentTime / video.duration) * 100;
            progressFilled.style.width = `${percent}%`;
            timeDisplay.innerText = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
        }
    });

    progressBar.addEventListener('click', (e) => {
        const rect = progressBar.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        if (video.duration) {
            video.currentTime = pos * video.duration;
        }
    });

    function showControlsTemporarily() {
        videoWrapper.classList.add('touch-active');
        clearTimeout(controlsTimeout);
        controlsTimeout = setTimeout(() => {
            if (!video.paused) {
                videoWrapper.classList.remove('touch-active');
            }
        }, 2800);
    }

    videoWrapper.addEventListener('mousemove', showControlsTemporarily);
    videoWrapper.addEventListener('touchstart', showControlsTemporarily);

    function playVideo(streamUrl, title, size, res, dur) {
        currentStreamUrl = streamUrl;

        document.getElementById('no-video-box').style.display = 'none';
        videoWrapper.style.display = 'block';
        document.getElementById('video-title').style.display = 'block';
        document.getElementById('grid-info').style.display = 'grid';
        document.getElementById('download-btn').style.display = 'flex';

        document.getElementById('video-title').innerText = title;
        document.getElementById('info-size').innerText = size;
        document.getElementById('info-res').innerText = res;
        document.getElementById('info-dur').innerText = dur;

        if (Hls.isSupported() && (streamUrl.includes('.m3u8') || !streamUrl.includes('.mp4'))) {
            const hls = new Hls();
            hls.loadSource(streamUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(() => {});
                updatePlayIcon(true);
            });
        } else {
            video.src = streamUrl;
            video.play().catch(() => {});
            updatePlayIcon(true);
        }
    }

    document.getElementById('download-btn').addEventListener('click', function(e) {
        e.preventDefault();
        if (currentStreamUrl) {
            window.open(currentStreamUrl, '_blank');
        }
    });

    const urlParams = new URLSearchParams(window.location.search);
    const directSrc = urlParams.get('src');
    if (directSrc) {
        const title = urlParams.get('title') || 'TeraBox Video';
        const size = urlParams.get('size') || 'Unknown';
        const res = urlParams.get('res') || 'Auto';
        const dur = urlParams.get('dur') || '--';
        playVideo(directSrc, title, size, res, dur);
    }
</script>

</body>
</html>
