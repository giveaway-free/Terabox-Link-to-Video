<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stream Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            -webkit-touch-callout: none; /* Disable long press popup in webview */
            -webkit-user-select: none;   /* Disable text selection */
            user-select: none;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding: 16px; 
            min-height: 100vh;
        }

        .container { 
            max-width: 600px; 
            margin: 0 auto; 
        }

        .video-wrapper { 
            width: 100%; 
            background: #000; 
            border-radius: 16px; 
            overflow: hidden; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); 
            margin-bottom: 20px; 
            border: 1px solid var(--border-color);
        }

        video { 
            width: 100%; 
            height: auto; 
            display: block; 
            max-height: 70vh; 
        }

        .file-title { 
            font-size: 16px; 
            font-weight: 600; 
            margin-bottom: 20px; 
            line-height: 1.4;
            color: var(--text-main);
            word-break: break-all; 
            background: var(--card-bg);
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .grid-info { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
            margin-bottom: 24px; 
        }

        .card { 
            background: var(--card-bg); 
            padding: 14px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color);
        }

        .card-label { 
            font-size: 11px; 
            font-weight: 700; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
            margin-bottom: 6px; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
        }

        .card-value { 
            font-size: 15px; 
            font-weight: 600; 
            color: var(--text-main); 
        }
        
        .btn-download {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
            transition: all 0.2s ease;
        }

        .btn-download:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="container">
    <div class="video-wrapper">
        <video id="video" controls autoplay playsinline></video>
    </div>

    <div class="file-title" id="video-title">Loading video title...</div>

    <div class="grid-info">
        <div class="card">
            <div class="card-label">📦 SIZE</div>
            <div class="card-value" id="info-size">--</div>
        </div>
        <div class="card">
            <div class="card-label">⏱️ DURATION</div>
            <div class="card-value" id="info-dur">--</div>
        </div>
        <div class="card">
            <div class="card-label">⚡ RESOLUTION</div>
            <div class="card-value" id="info-res">Auto</div>
        </div>
        <div class="card">
            <div class="card-label">📂 TYPE</div>
            <div class="card-value" id="info-type">Video</div>
        </div>
    </div>

    <button id="download-btn" class="btn-download">
        ⬇️ Direct Download
    </button>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoSrc = urlParams.get('src');
    const title = urlParams.get('title') || 'TeraBox Video';
    const size = urlParams.get('size') || 'Unknown';
    const res = urlParams.get('res') || 'Auto';
    const dur = urlParams.get('dur') || '--';
    const type = urlParams.get('type') || 'Video';

    document.getElementById('video-title').innerText = title;
    document.getElementById('info-size').innerText = size;
    document.getElementById('info-res').innerText = res;
    document.getElementById('info-dur').innerText = dur;
    document.getElementById('info-type').innerText = type;

    const video = document.getElementById('video');
    const dlBtn = document.getElementById('download-btn');

    if (videoSrc) {
        // Handle JS redirect for download without exposing URL on long press
        dlBtn.addEventListener('click', function(e) {
            e.preventDefault();
            window.open(videoSrc, '_blank');
        });

        if (Hls.isSupported() && (videoSrc.includes('.m3u8') || !videoSrc.includes('.mp4'))) {
            const hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
        } else {
            video.src = videoSrc;
        }

        video.onloadedmetadata = function() {
            if (dur === '--' && video.duration) {
                const totalSeconds = Math.floor(video.duration);
                const m = Math.floor(totalSeconds / 60);
                const s = totalSeconds % 60;
                const h = Math.floor(m / 60);
                const remM = m % 60;
                let formatted = "";
                if (h > 0) {
                    formatted = `${String(h).padStart(2, '0')}:${String(remM).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                } else {
                    formatted = `${String(remM).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                }
                document.getElementById('info-dur').innerText = formatted;
            }
        };
    }
</script>

</body>
</html>
